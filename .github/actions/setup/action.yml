name: setup
description: The toolchain and dependencies every ci job starts from.

runs:
  using: composite
  steps:
    # Before Setup Node, which needs pnpm on the PATH to cache its store.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    # Also generates the Prisma client (postinstall).
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
