name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs, except on main, where every push keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The `gate` line in package.json: one job per stage, one step per script, so a failure names itself.
# Add a check in both.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # After the install, so the restored caches land in an existing node_modules.
      - name: Restore Prettier, ESLint and TypeScript caches
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-static-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-static-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Duplication
        run: pnpm duplication

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Add a shard number to split the suite further; the shard count follows the list.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # After the install, so hashFiles reads the installed Playwright version. No restore-keys: a
      # browser built for another Playwright version is never used.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/@playwright/test/package.json') }}

      # The cache holds the browser, not the OS packages it needs.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Starts the seeded app itself (playwright.config.ts).
      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The one check to require in a branch ruleset: keep this job's name. A skipped required check
  # counts as passing, so this job runs whatever the others did and fails unless every one succeeded.
  ci:
    if: ${{ !cancelled() }}
    needs: [static, test, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS"
