name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these same checks before it publishes.
  workflow_call:

# Cancel superseded runs, except on main, where every push keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The `gate` line in package.json: one job per stage, one step per script, so a failure names itself.
# Add a check in both.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # After the install, so the restored caches land in an existing node_modules.
      - name: Restore Prettier, ESLint and TypeScript caches
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-static-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-static-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Duplication
        run: pnpm duplication

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Add a shard number to split the suite further; the shard count follows the list.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The same stage on Windows, where the app also runs: the whole suite, unsharded.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # After the install, so hashFiles reads the installed Playwright version. No restore-keys: a
      # browser built for another Playwright version is never used.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/@playwright/test/package.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # Starts the seeded app itself (playwright.config.ts).
      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Packs once; `smoke` installs that tarball, as a release would publish it.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Package
        run: pnpm package

      - name: Upload the package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The packaged app on every OS it supports, from the one tarball `package` packed.
  smoke:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download the package tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: package-tarball

      # Bash on every OS, so the glob expands (PowerShell would pass it literally).
      - name: Smoke
        shell: bash
        run: pnpm smoke --tarball package-tarball/*.tgz

  # The one check to require in a branch ruleset: keep this job's name. A skipped required check
  # counts as passing, so this job runs whatever the others did and fails unless every one succeeded.
  ci:
    if: ${{ !cancelled() }}
    needs: [static, test, test-windows, build, e2e, package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$NEEDS"
