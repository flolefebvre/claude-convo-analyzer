<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Transcript view — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!--
  The Transcript view's look: the Rail. Open it in a browser; it needs nothing else.
  Fake data. One avatar per Reply in a speaker gutter, a dot and a faint marker
  line per Turn, light Tool-call lines, and the Transcript filter in the agent
  tree's sidebar. Hidden content folds into a line that reveals it in place and
  hides it again. Click "Explore" in the sidebar for a Sub-agent's Transcript.
  Vocabulary: GLOSSARY.md (Reply, Turn, Transcript filter, Copied Message, …).
-->
<style>
  /* ---- Tokens (mirrors src/app/globals.css) ---- */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.53 0 0);
    --border: oklch(0.922 0 0);
    --cost: oklch(0.62 0.13 40);
    --cost-foreground: oklch(0.52 0.13 45);
    --agent: oklch(0.55 0.13 250);
    --agent-muted: oklch(0.55 0.13 250 / 10%);
    --agent-foreground: oklch(0.5 0.13 250);
    --destructive-muted: oklch(0.577 0.245 27.325 / 10%);
    --destructive-foreground: oklch(0.52 0.2 27);
    /* The Turn dot's ring and the dashed fold line. */
    --rail-dot: oklch(0.72 0 0);
    --fold-border: oklch(0.85 0 0);
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --border: oklch(1 0 0 / 10%);
      --cost: oklch(0.72 0.14 45);
      --cost-foreground: oklch(0.76 0.13 55);
      --agent: oklch(0.68 0.12 250);
      --agent-muted: oklch(0.68 0.12 250 / 18%);
      --agent-foreground: oklch(0.76 0.11 250);
      --destructive-muted: oklch(0.704 0.191 22.216 / 14%);
      --destructive-foreground: oklch(0.704 0.191 22.216);
      --rail-dot: oklch(0.5 0 0);
      --fold-border: oklch(1 0 0 / 22%);
    }
  }
  :root[data-theme="dark"] {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --border: oklch(1 0 0 / 10%);
    --cost: oklch(0.72 0.14 45);
    --cost-foreground: oklch(0.76 0.13 55);
    --agent: oklch(0.68 0.12 250);
    --agent-muted: oklch(0.68 0.12 250 / 18%);
    --agent-foreground: oklch(0.76 0.11 250);
    --destructive-muted: oklch(0.704 0.191 22.216 / 14%);
    --destructive-foreground: oklch(0.704 0.191 22.216);
    --rail-dot: oklch(0.5 0 0);
    --fold-border: oklch(1 0 0 / 22%);
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--foreground); background: var(--background); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--muted-foreground); outline-offset: 2px; }
  a { color: inherit; }
  svg { display: block; }

  /* ---- Prototype-only theme switch ---- */
  .proto-bar { display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: var(--muted); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
  .proto-bar button { min-height: 28px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--background); }
  .proto-bar button[aria-pressed="true"] { background: var(--foreground); color: var(--background); border-color: var(--foreground); }

  /* ---- Frame: agent-tree sidebar + pane ---- */
  .tview { display: flex; align-items: flex-start; }
  .tree { position: sticky; top: 0; width: 264px; flex-shrink: 0; min-height: 100vh; max-height: 100vh; overflow-y: auto; border-right: 1px solid var(--border); }
  .pane { flex: 1; min-width: 0; }
  .tree-block { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .tree-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); text-decoration: none; }
  .tree-link:hover { color: var(--foreground); }
  .tree-link svg { width: 13px; height: 13px; }
  .tree-title { margin: 10px 0 4px; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .tree-id { margin-bottom: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-caption { margin-bottom: 6px; font-size: 12px; color: var(--muted-foreground); }
  .node { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 32px; padding: 0 8px; border-radius: 6px; font-size: 13px; }
  .node:hover, .node[aria-current="page"] { background: var(--muted); }
  .node[aria-current="page"] { font-weight: 600; }
  .node.is-sub { margin-left: 16px; width: calc(100% - 16px); }
  .node-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted-foreground); }
  .node[aria-current="page"] .node-dot { background: var(--agent); border-color: var(--agent); }
  .tree-total { display: flex; align-items: baseline; font-size: 13.5px; color: var(--muted-foreground); }
  .tree-total .cost { font-size: 15px; font-weight: 600; }

  /* ---- Transcript filter (the sidebar's Show section) ---- */
  .show-toggle { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 32px; padding: 4px 8px; border-radius: 6px; font-size: 13px; color: var(--muted-foreground); }
  .show-toggle:hover { background: var(--muted); }
  .show-toggle[aria-pressed="true"] { color: var(--foreground); }
  .check { width: 14px; height: 14px; flex-shrink: 0; border-radius: 4px; border: 1.5px solid currentColor; display: grid; place-items: center; }
  .check svg { width: 10px; height: 10px; opacity: 0; }
  [aria-pressed="true"] > .check { background: var(--foreground); border-color: var(--foreground); }
  [aria-pressed="true"] > .check svg { opacity: 1; color: var(--background); }
  .show-count { margin-left: auto; font-size: 11.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .show-presets { display: flex; gap: 2px; margin-top: 6px; }
  .show-preset { min-height: 30px; padding: 4px 8px; border-radius: 6px; font-size: 12.5px; color: var(--muted-foreground); }
  .show-preset:hover { background: var(--muted); color: var(--foreground); }
  .show-preset[aria-pressed="true"] { color: var(--foreground); font-weight: 600; }

  /* ---- Pane header ---- */
  .pane-header { position: sticky; top: 0; z-index: 2; background: var(--background); border-bottom: 1px solid var(--border); }
  .pane-header-inner { max-width: 880px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  .crumbs { display: flex; gap: 6px; align-items: baseline; }
  .crumbs a { color: var(--muted-foreground); text-decoration: none; }
  .crumbs a:hover { color: var(--foreground); text-decoration: underline; }
  .crumbs .here { font-weight: 600; }
  .crumbs .sep { color: var(--muted-foreground); }
  .stats { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted-foreground); }

  /* ---- Transcript ---- */
  .transcript { max-width: 880px; margin: 0 auto; padding: 28px 24px 96px; display: flex; flex-direction: column; gap: 22px; }
  .cost { font-size: 12px; color: var(--cost-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
  .spacer { flex: 1; }
  .copied-from { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22rem; }
  .copied-from a { text-decoration: underline; text-decoration-color: var(--fold-border); text-underline-offset: 2px; }

  /* A row: the speaker gutter (avatar, and a Reply's rail line), then the body. */
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 14px; }
  .gutter { position: relative; display: flex; justify-content: center; align-items: flex-start; }
  .reply > .gutter::after { content: ""; position: absolute; top: 34px; bottom: 2px; left: 21px; width: 2px; border-radius: 1px; background: var(--border); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--background); flex-shrink: 0; }
  .avatar svg { width: 15px; height: 15px; }
  .avatar.is-you { background: var(--foreground); }
  .avatar.is-assistant { background: var(--cost); }
  .avatar.is-agent { background: var(--agent); border-radius: 8px; }
  .avatar.is-other-conversation { background: var(--agent-muted); color: var(--agent-foreground); border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--agent); }
  .reply.is-copied .avatar.is-assistant { background: var(--muted); color: var(--muted-foreground); }
  .row-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 28px; margin-bottom: 2px; font-size: 12px; }
  .speaker { font-size: 13px; font-weight: 600; }
  .reply .speaker { color: var(--cost-foreground); }
  .inter .speaker, .prompt.is-agent .speaker { color: var(--agent-foreground); }
  .row-note { color: var(--muted-foreground); }

  .bubble { border-radius: 4px 14px 14px 14px; padding: 10px 14px; overflow-wrap: anywhere; }
  .bubble p { margin: 0 0 6px; }
  .bubble > :last-child { margin-bottom: 0; }
  .prompt .bubble { background: var(--muted); font-size: 15px; white-space: pre-wrap; }
  .prompt.is-agent .bubble { background: var(--agent-muted); font-size: 14px; white-space: normal; }
  .prompt.is-copied .bubble, .reply.is-copied .turn-body { opacity: 0.78; }
  .inter .bubble { background: var(--agent-muted); }
  .inter.is-other-conversation .bubble { background: none; box-shadow: inset 0 0 0 1px var(--agent-muted); }

  /* A Turn: its dot on the rail, its faint marker line, then its body. */
  .turns > * + * { margin-top: 14px; }
  .turn { position: relative; }
  .turn::before { content: ""; position: absolute; left: -42px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--background); border: 2px solid var(--rail-dot); }
  .turn.is-failed::before { border-color: var(--destructive-foreground); }
  .turn-marker { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 3px; font-size: 11.5px; color: var(--muted-foreground); }
  .turn-number { font-weight: 500; }
  .chip { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--muted); color: var(--muted-foreground); white-space: nowrap; }
  .chip.is-model { font-family: var(--font-mono); }
  .chip.is-error { background: var(--destructive-muted); color: var(--destructive-foreground); }
  .sent-trigger { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 1px 7px; border-radius: 5px; font-size: 11.5px; color: var(--muted-foreground); }
  .sent-trigger svg { width: 11px; height: 11px; }
  .sent-trigger:hover, .sent-trigger[aria-expanded="true"] { background: var(--muted); color: var(--foreground); }
  .turn-body p { margin: 0 0 8px; max-width: 36rem; }
  .turn-body ul { margin: 0 0 8px; padding-left: 20px; max-width: 36rem; }
  .turn-body > :last-child { margin-bottom: 0; }
  .turn-failed { margin: 0; padding: 8px 12px; border-radius: 8px; background: var(--destructive-muted); color: var(--destructive-foreground); font-size: 13px; }
  .thinking { margin: 0 0 6px; font-size: 12px; color: var(--muted-foreground); }
  details.thinking summary { cursor: pointer; list-style: none; }
  details.thinking summary::-webkit-details-marker { display: none; }
  details.thinking summary::before { content: "›"; display: inline-block; width: 10px; transition: transform 150ms; }
  details.thinking[open] summary::before { transform: rotate(90deg); }
  .thinking-text { margin: 4px 0 0 10px; font-style: italic; max-width: 36rem; }

  /* Tool calls: one quiet container per Turn, a borderless line per call. */
  .calls { display: flex; flex-direction: column; margin: 8px 0; border-left: 2px solid var(--border); padding-left: 4px; }
  .call { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 30px; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; }
  .call:hover { background: var(--muted); }
  .chev { width: 13px; height: 13px; flex-shrink: 0; color: var(--muted-foreground); }
  .call-kind { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; background: var(--agent-muted); color: var(--agent-foreground); }
  .call-name { font-weight: 600; flex-shrink: 0; }
  .call-snippet { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .call-meta { font-size: 11.5px; color: var(--muted-foreground); white-space: nowrap; }
  .badge-err { font-size: 11px; color: var(--destructive-foreground); background: var(--destructive-muted); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }

  .sent-panel { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--muted); font-size: 12px; display: grid; gap: 3px; }
  .sent-panel strong { font-weight: 600; }

  /* What the filter hides folds into one line; once revealed, the same line hides it again. */
  .fold { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 10px; border-radius: 6px; border: 1px dashed var(--fold-border); font-size: 12px; color: var(--muted-foreground); }
  .fold:hover { color: var(--foreground); border-color: var(--muted-foreground); }
  .fold[aria-expanded="true"] { border-style: solid; color: var(--foreground); background: var(--muted); }
  .turn-body > .fold { margin: 4px 0 2px; }

  .task-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-top: 3px; font-size: 12.5px; color: var(--muted-foreground); }
  .task-kind { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; background: var(--muted); }

  @media (max-width: 720px) {
    .tview { flex-wrap: wrap; }
    .tree { position: static; width: 100%; min-height: 0; max-height: none; border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="proto-bar" role="group" aria-label="Prototype theme">
  <span>Theme</span>
  <button type="button" data-theme-pick="system" aria-pressed="true">System</button>
  <button type="button" data-theme-pick="light" aria-pressed="false">Light</button>
  <button type="button" data-theme-pick="dark" aria-pressed="false">Dark</button>
</div>
<div class="tview" id="app"></div>

<script>
  // ---- Fake data ----
  const MAIN = {
    speaker: "Assistant",
    model: "opus-4-8",
    stats: ["8 turns", "11 tool calls", "opus-4-8", "mixed effort"],
    cost: "$0.55",
    items: [
      { kind: "prompt", id: "p0", time: "Oct 24 · 17:40", copiedFrom: "Harden the upload path", paras: ["Sketch how we could stop retry storms on uploads."] },
      { kind: "reply", id: "r0", range: "17:40", copiedFrom: "Harden the upload path", turns: [
        { id: "t0", time: "17:40", copied: true, paras: ["Two levers: a per-user rate limit at the route, or backoff hints for the client. The limit is the one we control today, so start there."], calls: [] },
      ] },
      { kind: "prompt", id: "p1", time: "14:02", paras: ["Uploads are getting hammered by client retries. Add a per-user rate limit to the upload endpoint and keep the existing tests green."] },
      { kind: "reply", id: "r1", range: "14:02–14:05", cost: "$0.32", turns: [
        { id: "t1", time: "14:02", cost: "$0.08", thinking: { duration: "2.1s" }, paras: ["I’ll read the upload route and the middleware chain first."], calls: [
          { tool: "Read", snippet: "src/routes/upload.ts", meta: "3,120 chars" },
          { tool: "Read", snippet: "src/middleware/index.ts", meta: "1,804 chars" },
          { tool: "Grep", snippet: "\"rateLimit|throttle\" in src/", meta: "212 chars" },
        ], repeated: 2, sentNew: "your Prompt, 2 pieces of Injected context" },
        { id: "t2", time: "14:03", cost: "$0.06", paras: [], calls: [
          { tool: "Bash", snippet: "pnpm test upload", meta: "8,410 chars" },
          { tool: "Read", snippet: "tests/upload.test.ts", meta: "5,977 chars" },
        ], repeated: 5, sentNew: "3 tool results" },
        { id: "t3", time: "14:03", cost: "$0.11", thinking: { duration: "6.4s", summary: "No limiter exists yet, and the middleware chain is the right seam. A token bucket keyed by user id keeps bursts cheap." }, paras: ["Nothing limits requests today. I’ll have a sub-agent survey the limiter libraries already in the dependency tree while I write the middleware."], calls: [
          { tool: "Agent", agent: "Explore", snippet: "survey limiter libraries", meta: "$0.21" },
          { tool: "Write", snippet: "src/middleware/rate-limit.ts", meta: "1,240 chars" },
        ], repeated: 8, sentNew: "2 tool results" },
        { id: "t4", time: "14:05", cost: "$0.07", paras: [], calls: [
          { tool: "Edit", snippet: "src/routes/upload.ts", meta: "418 chars" },
          { tool: "Bash", snippet: "pnpm test upload", meta: "2,316 chars", failed: "exit 1" },
        ], repeated: 11, sentNew: "2 tool results" },
      ] },
      { kind: "inter", id: "i1", time: "14:06", from: "Explore", note: "hand-back", text: "rate-limiter-flexible is already a transitive dependency. Its in-memory store fits a single instance; a Redis store only matters once uploads run on several." },
      { kind: "task", id: "k1", time: "14:06", text: "Background command \"pnpm test --watch\" was stopped", status: "stopped" },
      { kind: "inter", id: "i2", time: "14:06", otherConversation: true, from: "docs-site release", note: "another Conversation · sent while working", text: "Docs freeze starts Friday: ping me before renaming any endpoint." },
      { kind: "reply", id: "r2", range: "14:06–14:08", cost: "$0.17", turns: [
        { id: "t5", time: "14:06", error: "the API was overloaded", paras: [], calls: [], repeated: 13, sentNew: "2 Inter-agent messages, 1 Task notification" },
        { id: "t6", time: "14:07", cost: "$0.12", thinking: { duration: "3.0s" }, effort: "medium effort", failedAttempts: "2 failed attempts · 9.4s lost", paras: ["The failure came from the test client reusing one user id for 30 requests in a row. The suite now gets its own limit."], calls: [
          { tool: "Edit", snippet: "tests/upload.test.ts", meta: "512 chars" },
          { tool: "Bash", snippet: "pnpm test", meta: "6,980 chars" },
        ], repeated: 16, sentNew: "1 tool result" },
        { id: "t7", time: "14:08", cost: "$0.05", model: "sonnet-5-5", paras: ["Done. Uploads are now limited to 20 requests a minute per user:"], bullets: [
          "src/middleware/rate-limit.ts: the token bucket, keyed by user id",
          "src/routes/upload.ts: mounts it before the body parser",
          "Tests: 14 passed, two of them new for the limit",
        ], calls: [], repeated: 16, sentNew: "2 tool results" },
      ] },
      { kind: "prompt", id: "p2", time: "14:09", paras: ["Make the limit configurable through an env var, default 20."] },
    ],
  };

  const EXPLORE = {
    speaker: "Explore",
    model: "haiku-4-5",
    stats: ["3 turns", "5 tool calls", "haiku-4-5"],
    cost: "$0.21",
    items: [
      { kind: "prompt", id: "e0", time: "14:03", fromAgent: "main", paras: [
        "Survey the rate-limiting libraries already in this repo’s dependency tree.",
        "For each one: which stores it supports, whether it is a direct or a transitive dependency, and how actively it is maintained. Keep it under 200 words.",
      ] },
      { kind: "reply", id: "er1", range: "14:03–14:06", cost: "$0.21", turns: [
        { id: "e1", time: "14:03", cost: "$0.04", paras: [], calls: [
          { tool: "Read", snippet: "package.json", meta: "2,204 chars" },
          { tool: "Grep", snippet: "\"limit\" in pnpm-lock.yaml", meta: "1,118 chars" },
        ], repeated: 0, sentNew: "the Task prompt" },
        { id: "e2", time: "14:04", cost: "$0.05", thinking: { duration: "1.2s" }, paras: ["Only one limiter shows up, pulled in by the queue package."], calls: [
          { tool: "Bash", snippet: "pnpm why rate-limiter-flexible", meta: "640 chars" },
          { tool: "Read", snippet: "node_modules/rate-limiter-flexible/README.md", meta: "12,000 chars" },
          { tool: "WebFetch", snippet: "npmjs.com/package/rate-limiter-flexible", meta: "3,410 chars" },
        ], repeated: 3, sentNew: "2 tool results" },
        { id: "e3", time: "14:06", cost: "$0.12", paras: ["rate-limiter-flexible is already a transitive dependency."], bullets: [
          "Stores: memory, Redis, Postgres, and a cluster mode",
          "Pulled in by bull-queue, so depending on it directly installs nothing new",
          "Maintained: a release this month",
        ], calls: [], repeated: 6, sentNew: "3 tool results" },
      ] },
    ],
  };

  const AGENTS = [
    { key: "main", label: "main", cost: "$0.55", transcript: MAIN, isSub: false },
    { key: "explore", label: "Explore", cost: "$0.21", transcript: EXPLORE, isSub: true },
  ];

  // The Transcript filter's kinds, in the sidebar's order.
  const KINDS = [
    ["toolCalls", "Tool calls"],
    ["thinking", "Thinking"],
    ["whatWasSent", "What was sent"],
    ["interAgent", "Inter-agent messages"],
    ["taskNotifications", "Task notifications"],
  ];
  const EVERYTHING = { toolCalls: true, thinking: true, whatWasSent: true, interAgent: true, taskNotifications: true };
  const MESSAGES_ONLY = { toolCalls: false, thinking: false, whatWasSent: false, interAgent: true, taskNotifications: false };

  // ---- Icons (lucide) ----
  const svg = (body, width = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const ICON = {
    you: svg('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>', 2.2),
    assistant: svg('<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>', 2.4),
    agent: svg('<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 8V4M9 13v1M15 13v1"/>', 2.2),
    otherConversation: svg('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>', 2.2),
    chevron: svg('<path d="m9 18 6-6-6-6"/>'),
    send: svg('<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'),
    check: svg('<path d="M20 6 9 17l-5-5"/>', 3.5),
    back: svg('<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>'),
    download: svg('<path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>'),
  };

  // ---- State ----
  const state = { agent: "main", show: { ...EVERYTHING }, revealed: new Set(), sentOpen: new Set() };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const isRevealed = (ids) => ids.every((id) => state.revealed.has(id));

  /** A line standing in for what the filter hides, or, once revealed, hiding it again. */
  function fold(ids, what) {
    const open = isRevealed(ids);
    return `<button type="button" class="fold" aria-expanded="${open}" data-fold="${ids.join(" ")}">${esc(what)}${open ? " · hide" : " hidden · show"}</button>`;
  }

  function turnMarker(turn, number, transcript) {
    const chips = [];
    if (turn.model) chips.push(`<span class="chip is-model">${esc(turn.model)}</span>`);
    if (turn.effort) chips.push(`<span class="chip">${esc(turn.effort)}</span>`);
    if (turn.error) chips.push(`<span class="chip is-error">API error</span>`);
    if (turn.failedAttempts) chips.push(`<span class="chip">${esc(turn.failedAttempts)}</span>`);
    const sentShown = state.show.whatWasSent && !turn.copied;
    const sentOpen = sentShown && state.sentOpen.has(turn.id);
    return `<div class="turn-marker">
      <span class="turn-number">Turn ${number}</span>
      <span class="time">${esc(turn.time)}</span>
      ${turn.cost ? `<span class="cost">${esc(turn.cost)}</span>` : ""}
      ${chips.join("")}
      ${sentShown ? `<button type="button" class="sent-trigger" aria-expanded="${sentOpen}" data-sent="${turn.id}">${ICON.send}What was sent</button>` : ""}
    </div>`;
  }

  function sentPanel(turn, transcript) {
    if (!state.show.whatWasSent || turn.copied || !state.sentOpen.has(turn.id)) return "";
    const model = (turn.model || transcript.model) + (turn.effort ? ` · ${turn.effort}` : "");
    return `<div class="sent-panel">
      <strong>What was sent · ${esc(turn.time)}:12</strong>
      <div>${esc(model)} · 32k max output</div>
      <div>System prompt: unchanged · Tool definitions: unchanged</div>
      <div>${turn.repeated === 0 ? "No earlier messages repeated" : `Repeated ${plural(turn.repeated, "earlier message")}`}</div>
      <div>New: ${esc(turn.sentNew)}</div>
    </div>`;
  }

  /** One Turn. `inFold`: it belongs to a run of Turns the filter emptied, revealed as a whole. */
  function renderTurn(turn, number, transcript, inFold) {
    const open = state.revealed.has(turn.id);
    const callsShown = turn.calls.length > 0 && (state.show.toolCalls || open);
    const thinkingShown = turn.thinking && (state.show.thinking || (inFold && open));
    let thinking = "";
    if (thinkingShown) {
      const label = `Thinking · ${turn.thinking.duration}`;
      thinking = turn.thinking.summary
        ? `<details class="thinking"><summary>${label}</summary><p class="thinking-text">${esc(turn.thinking.summary)}</p></details>`
        : `<p class="thinking">${label}</p>`;
    }
    const calls = callsShown
      ? `<div class="calls">${turn.calls
          .map(
            (call) => `<button type="button" class="call">${ICON.chevron.replace("<svg", '<svg class="chev"')}
              ${call.tool === "Agent" ? '<span class="call-kind">Agent</span>' : ""}
              <span class="call-name">${esc(call.agent || call.tool)}</span>
              <span class="call-snippet">${esc(call.snippet)}</span>
              ${call.failed ? `<span class="badge-err">${esc(call.failed)}</span>` : ""}
              <span class="call-meta">${esc(call.meta)}</span>
            </button>`,
          )
          .join("")}</div>`
      : "";
    return `<section class="turn${turn.error ? " is-failed" : ""}" aria-label="Turn ${number}, ${esc(turn.time)}">
      ${turnMarker(turn, number, transcript)}
      <div class="turn-body">
        ${thinking}
        ${turn.error ? `<p class="turn-failed">Turn failed: ${esc(turn.error)}.</p>` : ""}
        ${turn.paras.map((p) => `<p>${esc(p)}</p>`).join("")}
        ${turn.bullets ? `<ul>${turn.bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        ${!inFold && turn.calls.length > 0 && !state.show.toolCalls ? fold([turn.id], plural(turn.calls.length, "tool call")) : ""}
        ${calls}
        ${sentPanel(turn, transcript)}
      </div>
    </section>`;
  }

  /**
   * A Reply's Turns. A Turn left with nothing to show (no text, no error, its
   * calls and thinking filtered out) joins a run with its empty neighbours, and
   * the run folds into one line: "2 turns · 4 tool calls hidden · show".
   */
  function renderTurns(reply, firstNumber, transcript) {
    const out = [];
    let run = null;
    const flush = () => {
      if (run === null) return;
      const ids = run.map((entry) => entry.turn.id);
      const calls = run.reduce((n, entry) => n + entry.turn.calls.length, 0);
      out.push(fold(ids, `${plural(run.length, "turn")} · ${plural(calls, "tool call")}`));
      if (isRevealed(ids)) run.forEach((entry) => out.push(renderTurn(entry.turn, entry.number, transcript, true)));
      run = null;
    };
    reply.turns.forEach((turn, i) => {
      const number = firstNumber + i;
      const hasText = turn.paras.length > 0 || !!turn.bullets || !!turn.error;
      const visible = hasText || (turn.calls.length > 0 && state.show.toolCalls) || (turn.thinking && state.show.thinking);
      if (visible) {
        flush();
        out.push(renderTurn(turn, number, transcript, false));
      } else {
        (run ??= []).push({ turn, number });
      }
    });
    flush();
    return out.join("");
  }

  function renderItem(item, transcript, turnNumber) {
    if (item.kind === "prompt") {
      const byAgent = !!item.fromAgent;
      const who = byAgent ? `From ${item.fromAgent}` : "You";
      return `<article class="row prompt${byAgent ? " is-agent" : ""}${item.copiedFrom ? " is-copied" : ""}">
        <div class="gutter"><span class="avatar ${byAgent ? "is-agent" : "is-you"}">${byAgent ? ICON.agent : ICON.you}</span></div>
        <div>
          <div class="row-head"><span class="speaker">${esc(who)}</span><span class="time">${esc(item.time)}</span>
            ${item.copiedFrom ? `<span class="spacer"></span><span class="copied-from">copied from <a href="#">${esc(item.copiedFrom)}</a></span>` : ""}</div>
          <div class="bubble">${item.paras.map((p) => (byAgent ? `<p>${esc(p)}</p>` : esc(p))).join("")}</div>
        </div>
      </article>`;
    }
    if (item.kind === "inter" || item.kind === "task") {
      const shownByFilter = item.kind === "inter" ? state.show.interAgent : state.show.taskNotifications;
      const what = item.kind === "inter" ? `Inter-agent message from ${item.from}` : "Task notification";
      const line = shownByFilter ? "" : `<div class="row"><div class="gutter"></div><div>${fold([item.id], what)}</div></div>`;
      if (!shownByFilter && !state.revealed.has(item.id)) return line;
      if (item.kind === "task") {
        return `${line}<div class="row task"><div class="gutter"></div>
          <div class="task-line"><span class="task-kind">Task</span><span>${esc(item.text)}</span><span class="badge-err">${esc(item.status)}</span><span class="spacer"></span><span class="time">${esc(item.time)}</span></div>
        </div>`;
      }
      const other = !!item.otherConversation;
      return `${line}<article class="row inter${other ? " is-other-conversation" : ""}">
        <div class="gutter"><span class="avatar ${other ? "is-other-conversation" : "is-agent"}">${other ? ICON.otherConversation : ICON.agent}</span></div>
        <div>
          <div class="row-head"><span class="speaker">From ${esc(item.from)}</span><span class="row-note">${esc(item.note)}</span><span class="spacer"></span><span class="time">${esc(item.time)}</span></div>
          <div class="bubble"><p>${esc(item.text)}</p></div>
        </div>
      </article>`;
    }
    const calls = item.turns.reduce((n, turn) => n + turn.calls.length, 0);
    return `<article class="row reply${item.copiedFrom ? " is-copied" : ""}">
      <div class="gutter"><span class="avatar is-assistant">${ICON.assistant}</span></div>
      <div>
        <div class="row-head">
          <span class="speaker">${esc(transcript.speaker)}</span>
          <span class="row-note">${plural(item.turns.length, "turn")} · ${plural(calls, "tool call")}</span>
          <span class="spacer"></span>
          ${item.copiedFrom
            ? `<span class="copied-from">copied from <a href="#">${esc(item.copiedFrom)}</a></span>`
            : `<span class="time">${esc(item.range)}</span><span class="cost">${esc(item.cost)}</span>`}
        </div>
        <div class="turns">${renderTurns(item, turnNumber, transcript)}</div>
      </div>
    </article>`;
  }

  /** The filter counts describe the Agent's whole Transcript. */
  function counts(transcript) {
    const n = { toolCalls: 0, thinking: 0, whatWasSent: 0, interAgent: 0, taskNotifications: 0 };
    for (const item of transcript.items) {
      if (item.kind === "inter") n.interAgent += 1;
      if (item.kind === "task") n.taskNotifications += 1;
      for (const turn of item.turns ?? []) {
        n.toolCalls += turn.calls.length;
        if (turn.thinking) n.thinking += 1;
        if (!turn.copied) n.whatWasSent += 1;
      }
    }
    return n;
  }

  function sameShow(target) {
    return KINDS.every(([key]) => state.show[key] === target[key]);
  }

  function render() {
    const agent = AGENTS.find((a) => a.key === state.agent);
    const transcript = agent.transcript;
    const n = counts(transcript);
    let turnNumber = 1;
    const items = transcript.items
      .map((item) => {
        const html = renderItem(item, transcript, turnNumber);
        turnNumber += item.turns?.length ?? 0;
        return html;
      })
      .join("");
    const crumbs =
      agent.key === "main"
        ? `<span class="here" aria-current="page">main</span>`
        : `<a href="#" data-agent="main">main</a><span class="sep" aria-hidden="true">/</span><span class="here" aria-current="page">${esc(agent.label)}</span>`;

    document.getElementById("app").innerHTML = `
      <aside class="tree" aria-label="Agent tree">
        <div class="tree-block">
          <a class="tree-link" href="#">${ICON.back}All conversations</a>
          <div class="tree-title">Add a per-user rate limit to uploads</div>
          <div class="tree-id">3f9c2a1e-77b0-4c1d-9a52-1e0d5b6c8f40</div>
          <a class="tree-link" href="#">${ICON.download}Export as HTML</a>
        </div>
        <div class="tree-block">
          <div class="tree-caption">Agents</div>
          ${AGENTS.map(
            (a) => `<button type="button" class="node${a.isSub ? " is-sub" : ""}" data-agent="${a.key}" ${a.key === state.agent ? 'aria-current="page"' : ""}>
              <span class="node-dot"></span><span>${esc(a.label)}</span><span class="spacer"></span><span class="cost">${a.cost}</span></button>`,
          ).join("")}
        </div>
        <div class="tree-block tree-total"><span>Conversation total</span><span class="spacer"></span><span class="cost">$0.76</span></div>
        <div class="tree-block">
          <div class="tree-caption">Show</div>
          <div role="group" aria-label="Show in the transcript">
            ${KINDS.map(
              ([key, label]) => `<button type="button" class="show-toggle" aria-pressed="${state.show[key]}" data-kind="${key}">
                <span class="check">${ICON.check}</span><span>${label}</span><span class="show-count">${n[key]}</span></button>`,
            ).join("")}
          </div>
          <div class="show-presets">
            <button type="button" class="show-preset" aria-pressed="${sameShow(MESSAGES_ONLY)}" data-preset="messages">Messages only</button>
            <button type="button" class="show-preset" aria-pressed="${sameShow(EVERYTHING)}" data-preset="everything">Everything</button>
          </div>
        </div>
      </aside>
      <main class="pane">
        <div class="pane-header"><div class="pane-header-inner">
          <nav class="crumbs" aria-label="Agent lineage">${crumbs}</nav>
          <div class="stats">${transcript.stats.map((s) => `<span>${s}</span>`).join("")}<span class="cost">${transcript.cost}</span></div>
        </div></div>
        <div class="transcript">${items}</div>
      </main>`;
  }

  // ---- Events ----
  document.getElementById("app").addEventListener("click", (event) => {
    const target = event.target.closest("[data-agent],[data-kind],[data-preset],[data-fold],[data-sent]");
    if (!target) return;
    event.preventDefault();
    const { agent, kind, preset, fold: foldIds, sent } = target.dataset;
    if (agent) {
      state.agent = agent;
      state.revealed.clear();
      state.sentOpen.clear();
    } else if (kind) {
      state.show[kind] = !state.show[kind];
      state.revealed.clear();
    } else if (preset) {
      state.show = { ...(preset === "messages" ? MESSAGES_ONLY : EVERYTHING) };
      state.revealed.clear();
    } else if (foldIds) {
      const ids = foldIds.split(" ");
      const open = isRevealed(ids);
      ids.forEach((id) => (open ? state.revealed.delete(id) : state.revealed.add(id)));
    } else if (sent) {
      state.sentOpen.has(sent) ? state.sentOpen.delete(sent) : state.sentOpen.add(sent);
    }
    render();
  });

  document.querySelectorAll("[data-theme-pick]").forEach((button) =>
    button.addEventListener("click", () => {
      const pick = button.dataset.themePick;
      if (pick === "system") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = pick;
      document.querySelectorAll("[data-theme-pick]").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
    }),
  );

  render();
</script>
</body>
</html>
