/* ---------------- Rendering ---------------- */

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

let current = "main";

function lineage(id) {
  const chain = [];
  for (let a = AGENTS[id]; a; a = a.parent ? AGENTS[a.parent] : null) chain.unshift(a);
  return chain;
}

function renderTree() {
  const order = ["main", "exp1", "plan1", "gp1", "exp2"];
  const depth = (id) => lineage(id).length - 1;
  document.getElementById("tree").innerHTML = order.map((id) => {
    const a = AGENTS[id];
    const sub = a.sub ? ` <span class="node-sub">· ${esc(a.sub)}</span>` : "";
    return `<button class="node" style="--depth:${depth(id)}" aria-current="${id === current}" onclick="select('${id}')">
      <span class="node-glyph" aria-hidden>${a.parent ? "◇" : "◆"}</span>
      <span class="node-label">${esc(a.label)}${sub}</span>
      ${a.hasError ? '<span class="node-err" title="transcript recorded an API error"></span>' : ""}
      <span class="cost num">${a.cost}</span>
    </button>`;
  }).join("");
}

function renderHeader() {
  const chain = lineage(current);
  const crumb = chain.map((a, i) =>
    i === chain.length - 1
      ? `<span class="here">${esc(a.label)}</span>`
      : `<button onclick="select('${a.id}')">${esc(a.label)}</button><span class="sep" aria-hidden>/</span>`
  ).join(" ");
  const a = AGENTS[current];
  document.getElementById("pane-header").innerHTML = `
    <nav class="crumb" aria-label="Agent lineage">${crumb}</nav>
    <div class="stats">
      <span class="num">${a.turns} turns</span>
      <span class="num">${a.tools} tool calls</span>
      <span class="model">${esc(a.model)}</span>
      <span class="cost num turn-cost">${a.cost}</span>
    </div>`;
}

function renderCall(c) {
  if (c.type === "agent") {
    return `<details class="call">
      <summary><span class="chev" aria-hidden>▶</span><span class="kind kind-agent">Agent</span>
        <span class="call-name">${esc(c.name)}</span>
        <span class="call-snippet">${esc(c.snippet)}</span>
        <span class="cost num">${c.cost}</span></summary>
      <div class="call-body">
        <div class="io-block"><span class="microlabel">Prompt</span><pre>${esc(c.input)}</pre></div>
        <div class="io-block"><span class="microlabel">Returned</span><pre>${esc(c.result)}</pre></div>
        <button class="open-agent" onclick="select('${c.agent}')">Open transcript <span aria-hidden>→</span></button>
      </div>
    </details>`;
  }
  const kindClass = c.type === "skill" ? "kind-skill" : "kind-tool";
  const kindLabel = c.type === "skill" ? "Skill" : "Tool";
  const meta = c.isError
    ? '<span class="call-err">error</span>'
    : (c.size ? `<span class="call-meta num">${c.size}</span>` : "");
  const trunc = c.truncated
    ? `<div class="trunc"><span aria-hidden>✂</span> truncated — ${c.truncated}</div>` : "";
  return `<details class="call">
    <summary><span class="chev" aria-hidden>▶</span><span class="kind ${kindClass}">${kindLabel}</span>
      <span class="call-name">${esc(c.name)}</span>
      <span class="call-snippet">${esc(c.snippet)}</span>${meta}</summary>
    <div class="call-body">
      <div class="io-block"><span class="microlabel">Input</span><pre>${esc(c.input)}</pre></div>
      <div class="io-block"><span class="microlabel">Result</span><pre${c.isError ? ' class="err"' : ""}>${esc(c.result)}</pre>${trunc}</div>
    </div>
  </details>`;
}

function renderItem(item) {
  if (item.kind === "prompt") {
    return `<article class="prompt">
      <div class="prompt-head"><span class="microlabel">You</span><span class="call-meta num">${item.time}</span></div>
      <div class="prompt-body">${esc(item.text)}</div>
    </article>`;
  }
  if (item.kind === "slash") {
    return `<article class="prompt">
      <div class="prompt-head"><span class="microlabel">You</span><span class="call-meta num">${item.time}</span></div>
      <div class="slash"><span class="slash-cmd">${esc(item.cmd)}</span><span class="slash-args">${esc(item.args)}</span></div>
    </article>`;
  }
  if (item.kind === "metaHidden") {
    return `<div class="meta-hidden">${item.count} meta records hidden</div>`;
  }
  const err = item.apiError ? `<span class="badge-err">API error</span>` : "";
  const body = item.apiError && !item.html
    ? `<p class="api-error-note">turn failed — ${esc(item.apiError)}</p>`
    : item.html;
  return `<article class="turn">
    <div class="turn-head">
      <span class="microlabel" style="color:var(--agent)">Assistant</span>
      <span class="model">${esc(item.model)}</span>${err}
      <span class="spacer"></span>
      <span class="call-meta num">${item.time}</span>
      <span class="cost num turn-cost">${item.cost}</span>
    </div>
    <div class="turn-body">${body}</div>
    ${item.calls.length ? `<div class="calls">${item.calls.map(renderCall).join("")}</div>` : ""}
  </article>`;
}

function select(id) {
  current = id;
  renderTree();
  renderHeader();
  document.getElementById("transcript").innerHTML = TRANSCRIPTS[id].map(renderItem).join("");
  document.getElementById("pane").scrollTop = 0;
}

select("main");
</script>
